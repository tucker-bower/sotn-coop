# Where everything lives on a dev/agent machine. These defaults match the standard layout that
# scripts/bootstrap.sh creates. To override for one machine, copy entries into env.toml (git-ignored).
# Relative paths are relative to mods/co-op/. Check everything with: scripts/doctor.py

[paths]
repo = "../.."                       # sotn-decomp checkout
disks = "../../disks"                # upstream convention; git-ignored
env = ".env"                         # built tools, savestates, harness output; git-ignored
# Windows side (WSL mount). Master copies of discs/BIOS, plus GUI emulators for cross-checks.
win_emulators = "/mnt/c/Users/tucke/OneDrive/Desktop/Emulators"
win_masters = "/mnt/c/Users/tucke/OneDrive/Desktop/Emulators/SOTN"

[tools]
swanstation_core = ".env/bin/swanstation_libretro.so"
bios_dir = ".env/sys"                # OpenBIOS, installed under the file name scph5501.bin
savestates = ".env/savestates"
out = ".env/out"                     # harness reports, GIFs

# Disc images. sha1 values identify the dumps we've verified: the US tracks produce a 115/115
# matching build. These are hashes only, not game data.
[discs.us]
cue = "../../disks/sotn.us.cue"
required = true
sha1 = { "Castlevania - Symphony of the Night (USA) (Track 1).bin" = "f967119e006695a59a6442237f9fc7c7811cf7bf", "Castlevania - Symphony of the Night (USA) (Track 2).bin" = "1cb96a57f7363a2a43e79683f1a79c62bb6190dc" }

[discs.pspus]                        # Dracula X Chronicles (USA, ULUS-10277). Not usable by the Maria mod as-is (see research.md)
iso = "../../disks/sotn.pspus.iso"
required = false
sha1 = { "sotn.pspus.iso" = "ecdb3675c7238c0e94d256801aa7655b24f47cac" }

[discs.pspeu]                        # Dracula X Chronicles (EU, ULES-00841). What the Maria mod expects. Not owned yet.
iso = "../../disks/sotn.pspeu.iso"
required = false
